<!-- @dsCard group="Primitives" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Badge</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#020617;color:#e2e8f0;font-family:"Inter","Segoe UI",Roboto,sans-serif;font-size:14px;padding:1.25rem;line-height:1.5}
.label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#64748b;margin-bottom:.5rem;margin-top:1rem}
.label:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.75rem}
/* Meta chip */
.chip{display:inline-flex;max-width:100%;min-width:0;align-items:center;gap:.25rem;border-radius:9999px;border:1px solid rgb(51 65 85/.8);background:rgb(30 41 59/.5);padding:.25rem .625rem;font-size:11px;color:#e2e8f0;box-shadow:0 1px 2px rgb(0 0 0/.2),inset 0 0 0 1px rgb(2 6 23/.4)}
.chip-k{flex-shrink:0;font-weight:500;color:#64748b}
.chip-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:#f1f5f9}
/* Account type pills */
.pill{display:inline-flex;align-items:center;border-radius:9999px;border:1px solid;padding:.125rem .625rem;font-size:11px;font-weight:600;letter-spacing:.025em;line-height:1.25}
.p-ch{border-color:rgb(16 185 129/.35);background:rgb(16 185 129/.1);color:#d1fae5}
.p-sa{border-color:rgb(14 165 233/.35);background:rgb(14 165 233/.1);color:#e0f2fe}
.p-cr{border-color:rgb(139 92 246/.4);background:rgb(139 92 246/.12);color:#ede9fe}
.p-tf{border-color:rgb(245 158 11/.35);background:rgb(245 158 11/.1);color:#fef3c7}
.p-ca{border-color:rgb(132 204 22/.35);background:rgb(132 204 22/.1);color:#ecfccb}
.p-de{border-color:#475569;background:rgb(100 116 139/.1);color:#e2e8f0}
/* Notification badge */
.notif{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;background:#f59e0b;min-width:1rem;height:1rem;padding:0 .25rem;font-size:10px;font-weight:700;color:#020617;line-height:1}
/* Status dot */
.dot{width:.5rem;height:.5rem;border-radius:9999px;flex-shrink:0;display:inline-block}
.dot-ok{background:#10b981}.dot-warn{background:#fbbf24}.dot-err{background:#f87171}.dot-dis{background:#475569}
</style>
</head>
<body>

<div class="label">MetaChip — inline label + value</div>
<div class="row">
  <span class="chip"><span class="chip-k">Account</span><span class="chip-v">Visa (Credit Card)</span></span>
  <span class="chip"><span class="chip-k">Category</span><span class="chip-v">Groceries</span></span>
  <span class="chip"><span class="chip-k">Date</span><span class="chip-v">Jun 23, 2026</span></span>
  <span class="chip"><span class="chip-k">Source</span><span class="chip-v">Employment</span></span>
</div>

<div class="label">AccountTypePill</div>
<div class="row">
  <span class="pill p-ch">Chequing</span>
  <span class="pill p-sa">Savings</span>
  <span class="pill p-cr">Credit Card</span>
  <span class="pill p-tf">TFSA</span>
  <span class="pill p-tf">RRSP</span>
  <span class="pill p-tf">FHSA</span>
  <span class="pill p-ca">Cash</span>
  <span class="pill p-de">Non-Registered</span>
</div>

<div class="label">Notification count badge</div>
<div class="row">
  <span style="position:relative;display:inline-flex;width:2.25rem;height:2.25rem;align-items:center;justify-content:center;border-radius:.5rem;border:1px solid rgb(51 65 85/.8);background:rgb(15 23 42/.9);color:#e2e8f0">
    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>
    <span class="notif" style="position:absolute;top:-.25rem;right:-.25rem">3</span>
  </span>
  <span style="position:relative;display:inline-flex;width:2.25rem;height:2.25rem;align-items:center;justify-content:center;border-radius:.5rem;border:1px solid rgb(51 65 85/.8);background:rgb(15 23 42/.9);color:#e2e8f0">
    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>
    <span class="notif" style="position:absolute;top:-.25rem;right:-.25rem">9+</span>
  </span>
</div>

<div class="label">Status dots</div>
<div class="row" style="align-items:center;gap:1rem">
  <span style="display:inline-flex;align-items:center;gap:.375rem;font-size:.75rem"><span class="dot dot-ok"></span>Due soon</span>
  <span style="display:inline-flex;align-items:center;gap:.375rem;font-size:.75rem"><span class="dot dot-warn"></span>Overdue</span>
  <span style="display:inline-flex;align-items:center;gap:.375rem;font-size:.75rem"><span class="dot dot-err"></span>Critical</span>
  <span style="display:inline-flex;align-items:center;gap:.375rem;font-size:.75rem;color:#64748b"><span class="dot dot-dis"></span>Disabled</span>
</div>
</body>
</html>
