name: iOS TestFlight

# Builds the iPhone app in mobile/ on EAS (Expo's cloud Macs) and sends it to TestFlight.
# Started by hand from the Actions tab: Run workflow on main. The job only queues the build,
# so it finishes in a minute or two; the build and the upload to TestFlight carry on at Expo,
# and the link it prints shows how they went.
#
# The first build was made by hand with `npx eas-cli build` in mobile/, because EAS refuses to
# create an Apple distribution certificate without someone answering its prompts. This
# workflow reuses that certificate; see mobile/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI: eas-cli@27.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN repository secret is not set."
            exit 1
          fi
          npx --yes "$EAS_CLI" whoami

      - name: Install dependencies
        run: npm ci

      - name: Build and send to TestFlight
        run: npx --yes "$EAS_CLI" build --platform ios --profile production --non-interactive --auto-submit --no-wait
