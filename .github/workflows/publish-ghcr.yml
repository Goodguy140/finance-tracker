name: Publish GHCR Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ghcr-publish-${{ github.workflow }}-${{ github.ref }}
  # Not `true`: a following merge used to cancel an in-flight image push partway
  # through (run 35302488545). Queue the next release instead of aborting this one.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/finance-tracker-app

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  publish:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      # The nested test.yml `docker` job just built this exact image in the same
      # workflow run on the same ref, so it wrote to the same GHA cache scope --
      # this build is near-total layer hits rather than a second 2m36s build.
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
