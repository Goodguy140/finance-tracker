name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Docker build smoke test
        run: docker build -t finance-tracker-app:ci .

      # require('@prisma/engines') catches missing @prisma/* hoisted deps; migrate deploy --help exercises the CLI without a DB.
      - name: Docker Prisma CLI runtime smoke test
        run: docker run --rm finance-tracker-app:ci sh -c 'set -e && node -e "require(\"@prisma/engines\")" && ./node_modules/.bin/prisma migrate deploy --help >/dev/null'
