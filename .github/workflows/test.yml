name: Test

# No `push` trigger: pushes to main are covered by the nested run that
# publish-ghcr.yml starts via `workflow_call`. Having both meant every merge ran
# this entire workflow twice (~9 duplicated runner-minutes), and the concurrency
# group below could not dedupe them because inside a `workflow_call`
# `github.workflow` resolves to the *caller's* name, putting them in separate groups.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PRs are worth cancelling; an in-flight release is not. When called
  # from publish-ghcr.yml, `github.event_name` is the caller's event (`push`), so
  # two quick merges no longer have the second one cancel the first one's tests.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast correctness gate (~1m15s). `e2e` and `docker` fan out from here in
  # parallel, so a PR that fails lint stops before paying for either of them.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # `next build` skips test files, so four real type errors sat on green CI until
      # a Next upgrade started type-checking them and broke the build instead.
      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # There is deliberately no `npm run build` step here. Nothing consumed its
      # output -- `.next` is in .dockerignore, so the Docker build never saw it, and
      # `e2e` builds independently. The `docker` job's builder stage covers it.

  docker:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # buildx (rather than plain `docker build`) so this shares a layer cache with
      # the publish job, which previously rebuilt the same image from scratch.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          # Export to the local daemon so the smoke test below can `docker run` it.
          load: true
          tags: finance-tracker-app:ci
          cache-from: type=gha
          # mode=max: the expensive layers (npm ci in `deps`, next build in
          # `builder`) are intermediate stages, which mode=min would not cache.
          cache-to: type=gha,mode=max

      # require('@prisma/engines') catches missing @prisma/* hoisted deps; migrate deploy --help exercises the CLI without a DB.
      - name: Docker Prisma CLI runtime smoke test
        run: docker run --rm finance-tracker-app:ci sh -c 'set -e && node -e "require(\"@prisma/engines\")" && ./node_modules/.bin/prisma migrate deploy --help >/dev/null'

      # The real start-up chain (migrate deploy, repair script, server) as the unprivileged
      # user with a fresh /data volume: catches anything that needs to write where it cannot.
      - name: Docker start-up smoke test
        run: |
          docker run -d --name ft-smoke -p 3000:3000 \
            -e DATABASE_URL=file:/data/app.db \
            -e NEXTAUTH_URL=http://localhost:3000 \
            -e NEXTAUTH_SECRET=ci-smoke-secret-ci-smoke-secret-0123456789 \
            -e SERVER_SETTINGS_ENCRYPTION_KEY=ci-smoke-key-ci-smoke-key-0123456789abcdef \
            finance-tracker-app:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              curl -fsS -o /dev/null http://localhost:3000/login
              docker rm -f ft-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs ft-smoke
          exit 1

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_DATABASE_URL: file:./.data/e2e.db
      NEXTAUTH_URL: http://127.0.0.1:3050
      AUTH_TRUST_HOST: "true"
      # NEXTAUTH_SECRET / SERVER_SETTINGS_ENCRYPTION_KEY optional: playwright.config.ts
      # supplies CI-safe defaults when unset (fork PRs without repository secrets).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No DB prep step here on purpose: scripts/e2e-server.cjs unlinks the SQLite
      # file, recreates .data/, and runs `prisma db push` itself. CI used to apply
      # all 22 migrations to a database that was deleted seconds later.

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds browser binaries but not the apt-level system libraries,
      # so those still have to be installed on a hit.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # scripts/e2e-server.cjs runs a full `next build` before booting standalone;
      # persisting .next/cache makes that incremental. See Next's CI build caching guide.
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run E2E tests
        run: npm run test:e2e
